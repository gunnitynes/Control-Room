function vlq(n){const b=[n&0x7f];while((n>>=7))b.unshift((n&0x7f)|0x80);return b;}



/* ====================================================================
   LIVE MIDI OUT + CLASSROOM ROOM
   Web MIDI sends the loop, a MIDI clock and taps to any port (IAC bus,
   Apple Network MIDI, loopMIDI, rtpMIDI). A "room" links browsers peer
   to peer (PeerJS only introduces them); guests stream their notes to
   the host, who forwards them into the DAW, one MIDI channel per guest,
   and everyone's tempo and bar lines lock to the host.
   ==================================================================== */
const MIDI={access:null,out:null,outName:store.get('midiOut',''),notes:store.get('midiNotes',true),map:store.get('midiMap','drums'),clock:store.get('midiClock',false),taps:store.get('midiTaps',true),mute:false,offset:store.get('midiOff',0),nextClock:0,clockRun:false,err:'',lastHit:0};
const ROOM={role:null,peer:null,code:'',conns:new Map(),host:null,name:store.get('roomName',''),join:'',lock:true,buffer:store.get('roomBuf',40),offset:0,rtt:0,samples:[],anchor:0,hostTempo:null,ch:null,status:'',q:[],pingT:0,tempoT:0};
const CODE_ABC='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const rawPerf=t=>{try{const o=AC.getOutputTimestamp();if(o.performanceTime>0&&o.contextTime>0)return o.performanceTime+(t-o.contextTime)*1000;}catch(e){}return performance.now()+(t-AC.currentTime+(AC.outputLatency||0))*1000;};
const perfToCtx=p=>{try{const o=AC.getOutputTimestamp();if(o.performanceTime>0&&o.contextTime>0)return o.contextTime+(p-o.performanceTime)/1000;}catch(e){}return AC.currentTime+(p-performance.now())/1000-(AC.outputLatency||0);};
const LAYER_CH={A:0,B:1,C:2,K:3,S:4,H:5,O:6,T:7,P0:0,P1:1,P2:2,P3:3,P4:4,P5:5};
const f2m=f=>clamp(Math.round(69+12*Math.log2(f/440)),0,127);
const TAP_NOTE=39; // GM hand clap
function evToMidi(ev){
  const vel=clamp(Math.round(ev.g*127),1,127);
  if(MIDI.map==='drums'){const n=GM[ev.v];return n?[0x99,n,vel]:null;}
  const ch=LAYER_CH[ev.layer];if(ch==null)return null;const n=ev.f?f2m(ev.f):GM[ev.v];return n?[0x90|ch,n,vel]:null;
}
function portSend(msg,perf){if(!MIDI.out)return;try{MIDI.out.send(msg,Math.max(performance.now(),perf+MIDI.offset));}catch(e){}}
function noteOut(m,perf){
  if(MIDI.out){portSend(m,perf);portSend([0x80|(m[0]&15),m[1],0],perf+70);}
  if(ROOM.role==='guest')ROOM.q.push([Math.round(perf-performance.now()),m[0],m[1],m[2]]);
  MIDI.lastHit=performance.now();
}
const midiLive=()=>!!MIDI.out||ROOM.role==='guest';
function midiEvent(ev,at){if(!MIDI.notes||!midiLive()||ev.layer==='M'||cur==='qz')return;const m=evToMidi(ev);if(m)noteOut(m,rawPerf(at));}
function midiTap(ts){if(!MIDI.taps||!midiLive())return;noteOut([MIDI.map==='drums'?0x99:0x9F,TAP_NOTE,110],ts);if(ROOM.role==='guest')roomFlush();}
function midiStart(){if(!MIDI.clock||!MIDI.out||!S.playing)return;portSend([0xFA],rawPerf(S.t0));MIDI.nextClock=S.t0;MIDI.clockRun=true;}
function midiStop(){if(MIDI.clockRun){portSend([0xFC],performance.now());MIDI.clockRun=false;}}
function midiTick(ahead){
  if(MIDI.clockRun&&MIDI.out){const step=60/(Math.max(20,modes[cur].qpm())*24);let g=0;
    while(MIDI.nextClock<ahead&&g++<400){if(MIDI.nextClock>=AC.currentTime-0.03)portSend([0xF8],rawPerf(MIDI.nextClock));MIDI.nextClock+=step;}}
  roomFlush();
}
async function midiEnable(){
  if(!navigator.requestMIDIAccess){MIDI.err='none';renderLive();return;}
  try{MIDI.access=await navigator.requestMIDIAccess({sysex:false});MIDI.err='';MIDI.access.onstatechange=()=>{pickPort();renderLive();};pickPort();}
  catch(e){MIDI.err='denied';}
  renderLive();
}
function midiPorts(){return MIDI.access?[...MIDI.access.outputs.values()]:[];}
function pickPort(name){
  if(name!=null){MIDI.outName=name;store.set('midiOut',name);}
  const ps=midiPorts();MIDI.out=ps.find(p=>p.name===MIDI.outName)||null;
  if(!MIDI.out&&MIDI.outName===''&&ps.length===1){MIDI.out=ps[0];MIDI.outName=ps[0].name;}
  if(!MIDI.out)midiStop();else if(S.playing&&MIDI.clock&&!MIDI.clockRun){MIDI.nextClock=AC.currentTime+0.05;MIDI.clockRun=true;portSend([0xFA],rawPerf(MIDI.nextClock));}
  ledSync();
}

/* ---------- room transport ---------- */
function loadScript(src){return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.async=true;sc.onload=res;sc.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(sc);});}
async function needPeer(){if(!window.Peer)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js');}
async function needQR(){if(!window.QRCode)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js');}
const newCode=()=>[...Array(4)].map(()=>CODE_ABC[Math.floor(Math.random()*CODE_ABC.length)]).join('');
const peerId=c=>'meterlab-v2-'+c.toLowerCase();
const joinURL=()=>location.origin+location.pathname+'?room='+ROOM.code;
function roomStatus(t){ROOM.status=t;renderLive();}
async function hostRoom(){
  roomLeave(true);ROOM.role='host';roomStatus('Opening a room…');
  try{await needPeer();}catch(e){ROOM.role=null;roomStatus('Could not reach the room service. Check the internet connection.');return;}
  const tryOpen=(left)=>{ROOM.code=newCode();const peer=new Peer(peerId(ROOM.code),{debug:0});ROOM.peer=peer;
    peer.on('open',()=>{ROOM.anchor=performance.now();roomStatus('');ledSync();});
    peer.on('error',e=>{if(e.type==='unavailable-id'&&left>0){peer.destroy();tryOpen(left-1);return;}roomStatus('Room problem: '+(e.type||e.message));});
    peer.on('disconnected',()=>{try{peer.reconnect();}catch(e){}});
    peer.on('connection',conn=>{
      conn.on('open',()=>{const used=new Set([...ROOM.conns.values()].map(c=>c.ch));let ch=1;while((used.has(ch)||ch===10)&&ch<16)ch++;
        ROOM.conns.set(conn.peer,{conn,ch,name:'Guest',muted:false,last:0,ready:false,errs:[]});conn.send({t:'welcome',ch,bpm:bpmV,anchor:ROOM.anchor});renderLive();if(RING.open)setTimeout(ringSendAll,400);renderRingHost();});
      conn.on('data',m=>hostData(conn,m));
      conn.on('close',()=>{ROOM.conns.delete(conn.peer);renderLive();if(RING.open)ringSendAll();renderRingHost();});
      conn.on('error',()=>{ROOM.conns.delete(conn.peer);renderLive();});});};
  tryOpen(4);
}
function hostData(conn,m){
  const st=ROOM.conns.get(conn.peer);if(!st||!m||typeof m!=='object')return;
  if(m.t==='hi'){st.name=String(m.name||'Guest').slice(0,24);renderLive();renderRingHost();}
  else if(m.t==='ringready'){st.ready=true;renderRingHost();}
  else if(m.t==='ringtap'){st.errs.push(clamp(+m.e||0,-500,500));if(st.errs.length>12)st.errs.shift();st.lastTap=performance.now();}
  else if(m.t==='ping'){conn.send({t:'pong',a:m.a,b:performance.now()});}
  else if(m.t==='ev'&&Array.isArray(m.d)){
    st.last=performance.now();if(st.muted)return;const now=performance.now(),lat=clamp(+m.l||0,0,400),ch=st.ch-1;
    m.d.slice(0,200).forEach(e=>{if(!Array.isArray(e))return;const [lead,sb,n,v]=e;let when=now+(+lead||0)-lat+ROOM.buffer;if(when<now)when=now;
      const note=(n|0)&127,vel=clamp(v|0,1,127),on=0x90|ch;portSend([on,note,vel],when-MIDI.offset);portSend([0x80|ch,note,0],when-MIDI.offset+70);void sb;});
    flashGuest(conn.peer);}
}
function roomBroadcast(){if(ROOM.role!=='host')return;const msg={t:'tempo',bpm:bpmV,anchor:ROOM.anchor};ROOM.conns.forEach(c=>{try{c.conn.send(msg);}catch(e){}});}
async function joinRoom(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,4);if(code.length!==4){roomStatus('Room codes have 4 characters.');return;}
  roomLeave(true);ROOM.role='guest';ROOM.code=code;roomStatus('Connecting to '+code+'…');
  try{await needPeer();}catch(e){ROOM.role=null;roomStatus('Could not reach the room service. Check the internet connection.');return;}
  const peer=new Peer({debug:0});ROOM.peer=peer;
  peer.on('open',()=>{const conn=peer.connect(peerId(code),{serialization:'json',reliable:true});ROOM.host=conn;
    const fail=setTimeout(()=>{if(!conn.open){roomStatus('No room '+code+' found. Check the code with your teacher.');}},9000);
    conn.on('open',()=>{clearTimeout(fail);conn.send({t:'hi',name:ROOM.name||'Student'});ROOM.samples=[];for(let i=0;i<5;i++)setTimeout(()=>roomPing(),i*150);roomStatus('');});
    conn.on('data',m=>guestData(m));
    conn.on('close',()=>{if(ROOM.role==='guest'){roomStatus('The room closed.');ROOM.host=null;ROOM.hostTempo=null;ledSync();}});});
  peer.on('error',e=>{roomStatus(e.type==='peer-unavailable'?'No room '+code+' found. Check the code with your teacher.':'Room problem: '+(e.type||e.message));});
}
function guestData(m){
  if(!m||typeof m!=='object')return;
  if(m.t==='ring'||m.t==='ringprep'||m.t==='ringstop'){ringGuestData(m);return;}
  if(m.t==='welcome'){ROOM.ch=m.ch;ROOM.hostTempo={bpm:m.bpm,anchor:m.anchor};if(ROOM.lock)setBpm(m.bpm,'room');renderLive();ledSync();}
  else if(m.t==='tempo'){ROOM.hostTempo={bpm:m.bpm,anchor:m.anchor};if(ROOM.lock&&bpmV!==m.bpm)setBpm(m.bpm,'room');}
  else if(m.t==='pong'){const c=performance.now(),rtt=c-m.a;ROOM.samples.push({rtt,off:m.b-(m.a+c)/2});if(ROOM.samples.length>10)ROOM.samples.shift();
    const best=ROOM.samples.reduce((a,b)=>b.rtt<a.rtt?b:a);ROOM.offset=best.off;ROOM.rtt=best.rtt;renderLiveStats();}
}
function roomPing(){if(ROOM.role==='guest'&&ROOM.host&&ROOM.host.open)ROOM.host.send({t:'ping',a:performance.now()});}
function roomFlush(){if(ROOM.role!=='guest'||!ROOM.q.length)return;if(ROOM.host&&ROOM.host.open){try{ROOM.host.send({t:'ev',l:Math.round(ROOM.rtt/2),d:ROOM.q});}catch(e){}}ROOM.q=[];}
function roomLeave(quiet){if(RING.open)ringCloseHost(true);if(RG.prep||RG.on)ringGuestHide(true);try{if(ROOM.peer)ROOM.peer.destroy();}catch(e){}ROOM.peer=null;ROOM.host=null;ROOM.conns.clear();ROOM.role=null;ROOM.code='';ROOM.ch=null;ROOM.hostTempo=null;ROOM.q=[];ROOM.samples=[];if(!quiet)roomStatus('');ledSync();}
setInterval(()=>{const now=performance.now();if(ROOM.role==='guest'&&now-ROOM.pingT>2000){ROOM.pingT=now;roomPing();}if(ROOM.role==='host'&&now-ROOM.tempoT>1000){ROOM.tempoT=now;roomBroadcast();}},250);
/* shared bar grid: every play press starts on the next room downbeat */
function roomGrid(){
  if(ROOM.role==='host'&&ROOM.peer)return {a:ROOM.anchor,bar:4*60000/bpmV};
  if(ROOM.role==='guest'&&ROOM.lock&&ROOM.hostTempo&&ROOM.samples.length)return {a:ROOM.hostTempo.anchor-ROOM.offset,bar:4*60000/ROOM.hostTempo.bpm};
  return null;
}
function roomAlignStart(){
  const gr=roomGrid();if(!gr||!S.playing)return;const k=Math.ceil((performance.now()+180-gr.a)/gr.bar),Ts=gr.a+k*gr.bar,t=perfToCtx(Ts);
  if(t>AC.currentTime){S.t0=t;S.cs=t;S.idx=0;S.cinN=0;}
}
function roomTempoChanged(oldBpm){
  if(ROOM.role!=='host')return;if(RING.on)setTimeout(ringStartHost,0);const now=performance.now(),ob=4*60000/oldBpm,ph=(((now-ROOM.anchor)/ob)%1+1)%1;ROOM.anchor=now-ph*(4*60000/bpmV);roomBroadcast();
}
function flashGuest(id){const e=document.querySelector(`.rs[data-id="${CSS.escape(id)}"] i`);if(e){e.classList.add('hit');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('hit'),110);}ledHit();}
function ledHit(){const l=$('#mled');if(!l)return;l.classList.add('hit');clearTimeout(l._t);l._t=setTimeout(()=>l.classList.remove('hit'),90);}
function ledSync(){const l=$('#mled');if(!l)return;l.classList.toggle('on',!!MIDI.out);l.classList.toggle('room',!MIDI.out&&!!ROOM.role);}
setInterval(()=>{if(MIDI.lastHit&&performance.now()-MIDI.lastHit<60)ledHit();},50);

/* ---------- panel ---------- */
function renderLiveStats(){const s=$('#roomStats');if(s&&ROOM.role==='guest')s.textContent=ROOM.samples.length?`Connection ${Math.round(ROOM.rtt)} ms round trip · clock locked`:'Measuring the connection…';}
function renderLive(){
  const P=$('#mpanel');if(!P||P.hidden)return;const keep=document.activeElement&&P.contains(document.activeElement)?document.activeElement.id:null;
  const ps=midiPorts(),noMidi=!navigator.requestMIDIAccess;

/* ====================================================================
   CLASSROOM RING — every phone becomes one bead of the rhythm.
   The host (the teacher's laptop, ideally on the projector) picks a
   pattern; each guest phone is given one or more steps and schedules
   its own sound from the shared room clock, so the beat travels
   around the room without depending on Wi-Fi timing.
   ==================================================================== */
const RCOL=c=>({red:PAL.red,blue:PAL.blue,yel:PAL.yel,ink:PAL.ink}[c]||PAL.hair);
const RTXT=c=>c==='yel'?'#161514':c==='ink'?PAL.paper:'#fff';
const stepO=o=>Object.assign({s:'off',g:0.6,c:'off',lab:'·'},o);
function cfgMeter(beats,div,name){const n=beats*div,steps=[];for(let i=0;i<n;i++){const head=i%div===0,down=i===0;steps.push(stepO({s:down?'kick':head?'low':'tick',g:down?0.95:head?0.7:0.4,c:down?'red':head?'blue':'ink',lab:sylOf(div,i%div)}));}
  return {name:name||`${sigOf({beats,div}).join('/')} · ${beats} beats of ${div}`,n,cycleBeats:n/2,steps};}
function cfgGroups(g,unit,name){const n=g.reduce((a,b)=>a+b,0),steps=[];g.forEach((p,gi)=>{for(let k=0;k<p;k++){const head=k===0,down=head&&gi===0;steps.push(stepO({s:down?'kick':head?'low':'tick',g:down?0.95:head?0.7:0.4,c:down?'red':head?(p===3?'red':'blue'):'ink',lab:sylOf(p,k)}));}});
  return {name:name||`${g.join('+')} · additive`,n,cycleBeats:n*4/(unit||8),steps};}
function cfgPoly(a,b,cyc,name){const L=lcm(a,b),steps=[];for(let i=0;i<L;i++){const A=i%(L/a)===0,B=i%(L/b)===0;
  steps.push(stepO(A&&B?{s:'both',g:0.9,c:'red',lab:'A+B'}:A?{s:'low',g:0.8,c:'yel',lab:'A'}:B?{s:'high',g:0.8,c:'blue',lab:'B'}:{}));}
  return {name:name||`Polyrhythm ${a}:${b}`,n:L,cycleBeats:cyc||(L<=6?2:4),steps};}
function cfgEuclid(k,n,r,beats,name){const p=euRot(bjorklund(k,n),r||0),first=p.indexOf(1);
  return {name:name||`E(${k},${n})`,n,cycleBeats:beats||(n===16?4:n/2),steps:p.map((v,i)=>stepO(v?{s:i===first?'kick':'rim',g:i===first?0.9:0.8,c:i===first?'red':'blue',lab:'x'}:{}))};}
const RING_PATS=[
  {k:'mod',label:'Open module'},
  {k:'34',label:'3/4',make:()=>cfgMeter(3,2,'3/4 · three beats of two')},
  {k:'68',label:'6/8',make:()=>cfgMeter(2,3,'6/8 · two beats of three')},
  {k:'223',label:'2+2+3',make:()=>cfgGroups([2,2,3],8,'7/8 · 2+2+3')},
  {k:'332',label:'3+3+2',make:()=>cfgGroups([3,3,2],8,'Tresillo · 3+3+2')},
  {k:'32',label:'3:2',make:()=>cfgPoly(3,2,2)},
  {k:'43',label:'4:3',make:()=>cfgPoly(4,3,4)},
  {k:'e58',label:'Cinquillo',make:()=>cfgEuclid(5,8,0,4,'Cinquillo · E(5,8)')},
  {k:'e716',label:'Samba',make:()=>cfgEuclid(7,16,0,4,'Samba · E(7,16)')},
];
function cfgFromModule(){
  if(cur==='sc')return cfgMeter(sc.A.beats,sc.A.div);
  if(cur==='ad')return cfgGroups(ad.g,ad.u);
  if(cur==='pr')return cfgPoly(pr.a,pr.b,pr.cycle);
  if(cur==='eu'){const L=eu.L.B.on?'B':eu.L.A.on?'A':'C',x=eu.L[L];return cfgEuclid(x.k,x.n,x.r,x.n/EU_UNIT[eu.u].pb);}

}
function ringVoice(st,at){const g=st.g;switch(st.s){
  case 'kick':voice({v:'kick',g},at);voice({v:'low',f:523,g:g*0.55},at);break;
  case 'low':voice({v:'low',f:392,g},at);break;
  case 'high':voice({v:'high',f:1175,g},at);break;
  case 'both':voice({v:'kick',g:g*0.8},at);voice({v:'high',f:1568,g},at);break;

  case 'tick':voice({v:'shaker',g:g*0.8},at);break;}}
/* one scheduler for host guide and guests: o={cfg,start(local perf ms),bpm,mine:Set|null,play,q,hits} */
function ringRun(o){
  if(!o||!o.cfg||!AC)return;const cyc=o.cfg.cycleBeats*60000/o.bpm,st=cyc/o.cfg.n,now=performance.now(),hz=now+140;

const RG={prep:false,on:false,unlocked:false,cfg:null,seat:0,seats:0,mode:'play',run:null,fb:null,name:'',lock:null,silent:null};

  const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);const now=performance.now();
  const cfg=RG.cfg,mine=RG.run?[...RG.run.mine].sort((a,b)=>a-b):[];let curI=cfg&&mine.length?(mine.find(i=>cfg.steps[i].s!=='off')??mine[0]):null;

  if(cfg&&RG.seats)tx(x,`seat ${RG.seat} of ${RG.seats} · ${cfg.n} beads in the ring`,20,104,{f:'400 12px "Space Mono"',c:PAL.ink2});
  const cy=H*0.44,R=m*0.26;
  if(!cfg){tx(x,RG.unlocked?'You are in. Waiting for the teacher to start…':'',W/2,H*0.8,{f:'700 13px "Space Mono"',al:'center',c:PAL.ink2});return;}
  const silent=!sp||sp.s==='off';
  dot(x,W/2,cy,R*(1+flash*0.12),silent?null:RCOL(sp.c),PAL.ink,5);
  tx(x,silent?'rest':sp.lab,W/2,cy+R*0.18,{f:`900 ${Math.round(R*0.62)}px Archivo`,st:'condensed',al:'center',c:silent?PAL.ink3:RTXT(sp.c)});
  if(RG.run&&RG.mode==='perform'){const st=ringStepMs(RG.run);let nxt=null;RG.run.hits.forEach(h=>{if(h.tp>=now-40&&(nxt==null||h.tp<nxt.tp))nxt=h;});
    if(nxt){const lead=nxt.tp-now;if(lead<st*2.2){const k=clamp(lead/(st*2.2),0,1);dot(x,W/2,cy,R*(1+k*0.9),null,PAL.ink,4);}}
    if(RG.fb&&now-RG.fb.t<900)tx(x,RG.fb.txt.toUpperCase(),W/2,cy+R+46,{f:'900 28px Archivo',st:'condensed',al:'center',c:RG.fb.c});
    else tx(x,'TAP ANYWHERE WHEN THE RING CLOSES',W/2,cy+R+40,{f:'700 11px "Space Mono"',al:'center',c:PAL.ink2});}
  else if(RG.run)tx(x,'LISTEN · THE BEAT TRAVELS AROUND THE ROOM',W/2,cy+R+40,{f:'700 11px "Space Mono"',al:'center',c:PAL.ink2});
  const n=cfg.n,mcy=H*0.82,mr=Math.min(W*0.36,H*0.12),st=RG.run?ringStepMs(RG.run):1,pos=RG.run&&now>=RG.run.start?(now-RG.run.start)/st:null;
  dot(x,W/2,mcy,mr,null,PAL.hair,2);
  for(let i=0;i<n;i++){const a=-Math.PI/2+TAU*i/n,X=W/2+Math.cos(a)*mr,Y=mcy+Math.sin(a)*mr,s2=cfg.steps[i],own=mine.includes(i),b=Math.min(11,Math.PI*mr/n*0.45);
    if(s2.s==='off')dot(x,X,Y,b*0.4,PAL.ink3);else dot(x,X,Y,b,RCOL(s2.c),PAL.ink,2);if(own)dot(x,X,Y,b+5,null,PAL.ink,2.5);}
  if(pos!=null){const a=-Math.PI/2+TAU*((pos%n)/n);dot(x,W/2+Math.cos(a)*(mr-18),mcy+Math.sin(a)*(mr-18),5,PAL.ink);}
  tx(x,'YOU',W/2,mcy+4,{f:'700 10px "Space Mono"',al:'center',c:PAL.ink2});
}
setInterval(()=>{if(RING.run)ringRun(RING.run);if(RG.run&&RG.unlocked)ringRun(RG.run);},25);
function ringFrame(){if(RING.open)drawRingHost();if(!$('#ringv').hidden)drawRingGuest();}

/* state in the link */
const SAVE_IDS=['sc','ad','pr','pm','eu','sw','pg'];
function serialize(){const o={v:3,bpm:bpmV};SAVE_IDS.forEach(id=>o[id]=modes[id].save());return '#'+cur+'~'+btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function deserialize(h){const [id,pl]=h.replace(/^#/,'').split('~');
  if(pl){try{const o=JSON.parse(decodeURIComponent(escape(atob(pl.replace(/-/g,'+').replace(/_/g,'/')))));if(o&&o.v===3){if(Number.isInteger(o.bpm))setBpm(o.bpm);SAVE_IDS.forEach(k=>{if(o[k])try{modes[k].load(o[k]);}catch(e){}});}}catch(e){}}
  return modes[id]?id:null;}
let lastHash='';
setInterval(()=>{try{const s=serialize();if(s!==lastHash){history.replaceState(null,'',s);lastHash=s;}}catch(e){}},800);
$('#uQuiz').onclick=()=>{const t=$('#uQuiz').dataset.topic;if(!t)return;arc.topics=new Set([t]);arc.kinds=new Set(['hear','build','play']);arcStart(10);};
const _shareUnused=async()=>{const url=location.href.split('#')[0]+serialize();try{await navigator.clipboard.writeText(url);toast('Link copied: it opens this exact setup');}catch(e){prompt('Copy this link',url);}};

/* keyboard */
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.code==='Space'){e.preventDefault();setPlaying(!S.playing);return;}
  if(e.repeat)return;
  const k=e.key.toLowerCase();
  if(k==='j'||k==='k'){e.preventDefault();tapJ(e.timeStamp);return;}
  if(cur==='qz'&&arc.screen==='q'&&!arc.done&&arc.q&&arc.q.kind==='hear'){const i='asdfgh'.indexOf(k);if(i>=0&&arc.q.options[i]){hearAnswer(arc.q.options[i].id);return;}}
  if(cur==='qz'&&arc.screen==='q'&&!arc.done&&arc.q&&arc.q.kind==='play'&&(k==='enter'||k==='r')&&take.state!=='armed'){e.preventDefault();takeBegin();return;}
  if(k==='n'||(k==='enter'&&cur==='qz'&&(arc.done||arc.screen!=='q'))){if(cur==='qz'&&arc.screen==='q'&&!arc.done)return;e.preventDefault();if(arc.screen==='q'&&arc.done)arcNext();else arcStart(arc.screen==='result'?arc.len:10);return;}
  if(k==='t'){tapTempo();return;}
  if(k==='m'){setMetro(!clickOn());toast(clickOn()?'Click on':'Click off');return;}
  if(cur==='pg'&&!e.metaKey){const pi='asdfgh'.indexOf(k);if(pi>=0&&pg.tracks[pi]){e.preventDefault();pg.rec?pgStepToggle(pi):pgPad(pi,e.timeStamp);return;}
    if(pg.rec&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();pgMove(e.key==='ArrowRight'?1:-1);return;}if(pg.rec&&(e.key==='Backspace'||e.key==='Delete')){e.preventDefault();pgClearStep();return;}}
  if(/^[1-8]$/.test(e.key)){show(MODS[+e.key-1].id);return;}
});

/* ====================================================================
   RENDER LOOP
   ==================================================================== */
const leds=$('#leds');for(let i=0;i<14;i++)leds.appendChild(el('i',i>=11?'hot':''));
const ledEls=[...leds.children];let pk=0,lastLed=-1,lastCin='';
function frame(){
  const T=performance.now()/1000;let ph=null,cyc=0;
  if(S.playing&&AC){const now=hearTime();
    if(now<S.t0){const k=S.cinN?Math.floor((now-S.cinStart)/S.cinBeat)+1:0;const s=k>=1&&k<=S.cinN?String(k):'';if(s!==lastCin){$('#cinv').textContent=s;lastCin=s;}}
    else{const e=(now-S.t0)/S.D;cyc=Math.floor(e);ph=e-cyc;if(lastCin){$('#cinv').textContent='';lastCin='';}}}
  let peak=0,rms=0;
  if(analyser&&S.playing){analyser.getFloatTimeDomainData(abuf);for(let i=0;i<abuf.length;i++){const a=abuf[i];if(Math.abs(a)>peak)peak=Math.abs(a);rms+=a*a;}rms=Math.sqrt(rms/abuf.length);}
  LVL=LVL*0.8+Math.min(1,rms*4)*0.2;pk=Math.max(peak,pk*0.92);
  const lit=Math.round(clamp((20*Math.log10(pk+1e-6)+42)/42,0,1)*14);if(lit!==lastLed){ledEls.forEach((l,i)=>l.classList.toggle('on',i<lit));lastLed=lit;}
  const st=stages[cur];
  if(st&&st.w>0){const scene=cur==='qz'?SCENES[arc.scene]:st.scene;const I={ph,cyc,D:S.playing?S.D:Math.max(0.05,modes[cur].duration()),T,playing:S.playing,tap:cur==='qz'?null:TP.target};
    st.ctx.clearRect(0,0,st.w,st.h);try{scene(st.ctx,st.w,st.h,I,st.params());}catch(err){console.error(err);}}
  if(modes[cur].frame)modes[cur].frame(ph);
  ringFrame();
  requestAnimationFrame(frame);
}

/* ====================================================================
   INIT
   ==================================================================== */
readColors();renderNotes();navBadges();
const startId=deserialize(location.hash||'')||'sc';
resyncUI();show(startId);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>fitStage());
frame();

/* ====================================================================
   EMBED MODE (?embed) — Meter Lab inside Control Room.
   Only the Arcade figure is shown; Control Room asks for "hear it"
   questions through window.MLAPI, plays them, and reveals the figure.
   ==================================================================== */
if(new URLSearchParams(location.search).has('embed')){
  document.documentElement.classList.add('ml-embed');
  const css=document.createElement('style');
  css.textContent=`.ml-embed body{overflow:hidden}.ml-embed #stage-qz{position:fixed!important;inset:0!important;z-index:9999;border:0!important;height:auto!important;width:auto!important;margin:0!important}`;
  document.head.appendChild(css);
  show('qz');arc.screen='start';
  let recent=[];
  window.MLAPI={
    topics:ARC_TOPICS.map(t=>({k:t.k,label:t.label})),
    levels:LEVELS.map(l=>({n:l.n,name:l.name,d:l.d})),
    question(level,topics){
      const keys=Object.keys(GEN).filter(k=>{const [t,kd]=k.split(':');return kd==='hear'&&(!topics||!topics.length||topics.includes(t));});
      const fresh=keys.filter(k=>!recent.includes(k)),key=pick(fresh.length?fresh:keys);recent.push(key);if(recent.length>Math.min(4,keys.length-1))recent.shift();
      const q=GEN[key](level);q.key=key;q.level=level;
      arc.q=q;arc.screen='q';arc.done=false;arc.aud='target';arc.build=null;arc.scene='listen';arc.P={word:'LISTEN'};
      if(cur!=='qz')show('qz');
      return {key,topic:q.topic,prompt:q.prompt,hint:q.hint,answer:q.answer,explain:q.explain,
        options:q.options.map(o=>({id:o.id,big:o.big||'',small:o.small||'',mini:o.mini||''}))};
    },
    play(){ensureAudio();if(AC&&AC.state==='suspended')AC.resume();if(S.playing)resync(false);else setPlaying(true);},
    stop(){setPlaying(false);},
    reveal(){if(!arc.q)return;arc.done=true;arc.scene=arc.q.scene;arc.P=arc.q.P;},
    listen(word){arc.scene='listen';arc.P={word:word||'LISTEN'};},
    theme(night){if(night)document.documentElement.dataset.theme='night';else delete document.documentElement.dataset.theme;readColors();},
  };
  try{parent.postMessage({ml:'ready'},'*');}catch(e){}
}
})();
</script>
